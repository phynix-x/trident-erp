name: Deploy Rental ERP to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rental-erp-pages
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout ERP
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate ERP prototype and safety checks
        run: node tools/validate-erp.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static ERP
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publish ERP
        id: deployment
        uses: actions/deploy-pages@v4
